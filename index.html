body{background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;max-width:430px;margin:0 auto;padding-bottom:80px;min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
.header{background:#1a1a1a;padding:14px 16px 10px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center}
.header-left .goal{font-size:13px;color:#4ade80;font-weight:700}
.header-left .day-label{font-size:11px;font-weight:600;margin-top:2px}

.content{padding:12px 12px 0}
.card{background:#1a1a1a;border-radius:14px;padding:16px;margin-bottom:12px}
.card-title{color:#fff;font-size:15px;font-weight:700;margin-bottom:12px}

.nav-btn{flex:1;padding:10px 0;border:none;background:none;color:#666;font-size:10px;font-weight:400;border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn.active{color:#4ade80;border-top-color:#4ade80;font-weight:700}
.nav-icon{font-size:16px}
.stat-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat-box{flex:1;min-width:80px;background:#1a1a1a;border-radius:12px;padding:12px;text-align:center}
.stat-val{font-size:18px;font-weight:800}
.stat-lbl{font-size:9px;color:#666;margin-top:2px}
.progress-bar-bg{background:#2a2a2a;border-radius:8px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:8px;transition:width .4s}
.macro-row{margin-bottom:8px}
.macro-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.macro-labels span:first-child{color:#aaa}
.macro-labels span:last-child{color:#fff}
.macro-labels span:last-child em{color:#666;font-style:normal}
.water-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.water-btn{flex:1;background:#2a2a2a;border:1px solid #333;color:#60a5fa;border-radius:8px;padding:8px 4px;font-size:13px}
.reset-btn{background:none;border:none;color:#666;font-size:11px;margin-top:4px}
.weight-row{display:flex;gap:8px;align-items:center}
.inp{background:#2a2a2a;border:1px solid #333;border-radius:10px;padding:10px 14px;color:#fff;font-size:15px;width:100%}
.rule-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.rule-num{background:#4ade80;color:#111;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.rule-txt{color:#ccc;font-size:13px;line-height:1.4}
.meal-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222;cursor:pointer}
.meal-item:last-child{border-bottom:none}
.meal-check{width:28px;height:28px;border-radius:50%;border:2px solid #444;background:none;display:flex;align-items:center;justify-content:center;color:#666;font-size:14px;flex-shrink:0;transition:all .2s}
.meal-check.done{border-color:#4ade80;background:#4ade80;color:#111}
.meal-name{font-size:14px;font-weight:600;transition:all .2s}
.meal-name.done{color:#666;text-decoration:line-through}
.meal-macros{font-size:11px;color:#555;margin-top:2px}

.supp-item:last-child{border-bottom:none}

.ex-weight-lbl{font-size:12px;color:#666}

// ─── STATE ───────────────────────────────────────────────────────────────────
let lang="es",tab="dashboard",allData={};
const todayKey=()=>new Date().toISOString().split("T")[0];
const dow=()=>{const d=new Date().getDay();return d===0?6:d-1;};
const dowFrom=k=>{const d=new Date(k+"T12:00:00").getDay();return d===0?6:d-1;};
function load(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)allData=JSON.parse(r);}catch{}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(allData));}catch{}}
function updateToday(patch){const k=todayKey();allData[k]={...(allData[k]||{}),...patch};save();render();}
function td(){return allData[todayKey()]||{};}
function pct(v,m){return Math.min(100,Math.round(v/m*100));}

// ─── IMC ─────────────────────────────────────────────────────────────────────
function calcIMC(w){return(w/((HEIGHT_CM/100)**2)).toFixed(1);}
function imcCategory(imc,l){
  if(imc<18.5)return l==="es"?"Bajo peso":"Underweight";
  if(imc<25)return l==="es"?"Normal":"Normal";
  if(imc<30)return l==="es"?"Sobrepeso":"Overweight";
  return l==="es"?"Obesidad":"Obese";
}
function imcColor(imc){
  if(imc<18.5)return"#60a5fa";
  if(imc<25)return"#4ade80";
  if(imc<30)return"#f59e0b";
  return"#f87171";
}
function imcBarPct(imc){
  // range 15-40 mapped to 0-100%
  return Math.min(100,Math.max(0,((imc-15)/25)*100));
}

function streak(){
  let s=0;const d=new Date();
  for(let i=0;i<90;i++){
    const k=d.toISOString().split("T")[0];
    const dd=allData[k];
    if(dd&&(dd.weight||Object.keys(dd.meals||{}).length>0))s++;
    else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  return s;
}
function latestWeight(){
  const keys=Object.keys(allData).sort().reverse();
  for(const k of keys){if(allData[k]?.weight)return parseFloat(allData[k].weight);}
  return START_W;
}
function completedMacros(){
  const plan=MEAL_PLAN[dow()];const meals=td().meals||{};
  return plan.meals.filter(m=>meals[m.id]).reduce((a,m)=>({cal:a.cal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{cal:0,p:0,c:0,f:0});
}

// ─── CSV EXPORT (fixed) ───────────────────────────────────────────────────────
function escCSV(v){
  const s=String(v===null||v===undefined?"":v);
  if(s.includes(",")||s.includes('"')||s.includes("\n"))return'"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCSV(){
  try{
    const hdr=["date","weight_kg","water_L","training_type","cardio_done","exercises_done","exercise_weights","calories_done","protein_done_g","carbs_done_g","fat_done_g","meals_checked","supplements_checked","notes"];
    const rows=[hdr.join(",")];
    const sortedKeys=Object.keys(allData).sort();
    for(const date of sortedKeys){
      const d=allData[date];
      const dw=dowFrom(date);
      const plan=MEAL_PLAN[dw]||MEAL_PLAN[0];
      const meals=d.meals||{};
      const exObj=d.exercises||{};
      const exWeights=d.exerciseWeights||{};
      const supps=d.supps||{};
      const mealsChecked=Object.keys(meals).filter(k=>meals[k]).join("|");
      const suppsChecked=Object.keys(supps).filter(k=>supps[k]).join("|");
      const exDone=Object.keys(exObj).filter(k=>exObj[k]).length;
      const exWeightsStr=Object.entries(exWeights).map(([k,v])=>`${k}:${v}kg`).join("|");
      const macro=plan.meals.filter(m=>meals[m.id]).reduce((a,m)=>({cal:a.cal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{cal:0,p:0,c:0,f:0});
      const row=[
        escCSV(date),escCSV(d.weight||""),escCSV(d.water||""),
        escCSV(d.training||""),escCSV(d.cardio?"1":"0"),
        escCSV(exDone),escCSV(exWeightsStr),
        escCSV(macro.cal),escCSV(macro.p),escCSV(macro.c),escCSV(macro.f),
        escCSV(mealsChecked),escCSV(suppsChecked),escCSV(d.notes||"")
      ];
      rows.push(row.join(","));
    }
    const csv=rows.join("\r\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="fatloss_"+todayKey()+".csv";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  }catch(e){alert("Error al exportar: "+e.message);}
}
function downloadJSON(){
  try{
    const blob=new Blob([JSON.stringify(allData,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download="fatloss_"+todayKey()+".json";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  }catch(e){alert("Error al exportar: "+e.message);}
}

    <div class="card-title">🗓️ ${lang==="es"?"Resumen":"Summary"}</div>
    <div style="display:flex;gap:10px">
      <div class="summary-box"><div class="summary-val" style="color:#4ade80">${totalDays}</div><div class="summary-lbl">${lang==="es"?"días registrados":"days logged"}</div></div>
      <div class="summary-box"><div class="summary-val" style="color:#f59e0b">${streak()}</div><div class="summary-lbl">${lang==="es"?"racha actual":"current streak"}</div></div>
      <div class="summary-box"><div class="summary-val" style="color:#60a5fa">${Math.max(0,START_W-lw).toFixed(1)}</div><div class="summary-lbl">kg ${lang==="es"?"perdidos":"lost"}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">📈 ${lang==="es"?"Historial de Peso":"Weight History"}</div>
    ${weightEntries.length?weightEntries.map(([date,d])=>`<div class="hist-row"><span style="color:#aaa;font-size:13px">${date}</span><span style="font-weight:700">${d.weight} kg <span style="color:#555;font-size:11px">(IMC ${calcIMC(parseFloat(d.weight))})</span></span></div>`).join(""):`<p style="color:#555;font-size:13px">${lang==="es"?"Sin datos aún":"No data yet"}</p>`}
  </div>
  <div class="card">
    <div class="card-title">📊 ${lang==="es"?"Mis Objetivos":"My Targets"}</div>
    ${targets.map(r=>`<div class="targets-row"><span style="color:#aaa;font-size:13px">${lang==="es"?r.es:r.en}</span><span style="font-weight:700;font-size:13px">${r.val}</span></div>`).join("")}
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  const w=WORKOUT_PLAN[dow()];const wc=TYPE_COLOR[w.type];
  const tabs=[
    {id:"dashboard",icon:"📊",es:"Dashboard",en:"Dashboard"},
    {id:"today",icon:"🍽️",es:"Hoy",en:"Today"},
    {id:"gym",icon:"🏋️",es:"Gym",en:"Gym"},
    {id:"week",icon:"📅",es:"Semana",en:"Week"},
    {id:"data",icon:"💾",es:"Datos",en:"Data"},
  ];
  let content="";
  if(tab==="dashboard")content=renderDashboard();
  else if(tab==="today")content=renderToday();
  else if(tab==="gym")content=renderGym();
  else if(tab==="week")content=renderWeek();
  else if(tab==="data")content=renderData();

  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="header-left">
        <div class="goal">95kg → 82kg</div>
        <div class="day-label" style="color:${wc}">${TYPE_ICON[w.type]} ${lang==="es"?w.es:w.en}</div>
      </div>
      <button class="lang-btn" onclick="setLang()">${lang==="es"?"EN":"ES"}</button>
    </div>
    <div class="content">${content}</div>
    <div class="bottom-nav">
      ${tabs.map(t=>`<button class="nav-btn ${tab===t.id?"active":""}" onclick="setTab('${t.id}')">
        <span class="nav-icon">${t.icon}</span>
        <span>${lang==="es"?t.es:t.en}</span>
      </button>`).join("")}
    </div>`;
}

load();render();
</script>
</body>
</html>
